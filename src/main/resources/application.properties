quarkus.datasource.db-kind=mysql
quarkus.datasource.reactive.url=mysql://localhost:3306/productdb
quarkus.datasource.username=root
quarkus.datasource.password=rootroot
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true
# enable CORS
quarkus.http.cors=true
# allow your dev origin (or use * for all origins during dev)
quarkus.http.cors.origins=http://localhost:8090
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,origin,x-requested-with
quarkus.http.cors.exposed-headers=location
quarkus.http.cors.access-control-max-age=24H